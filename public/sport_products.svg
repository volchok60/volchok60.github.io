<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dynamic swoosh element -->
  <path d="M 20 60 Q 35 35 55 45 Q 70 55 85 40 Q 100 25 120 35" 
        stroke="url(#accentGradient)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Sport icon elements -->
  <!-- Basketball -->
  <circle cx="35" cy="50" r="8" fill="url(#primaryGradient)" opacity="0.9"/>
  <path d="M 27 50 Q 35 42 43 50" stroke="#fff" stroke-width="1.5" fill="none"/>
  <path d="M 27 50 Q 35 58 43 50" stroke="#fff" stroke-width="1.5" fill="none"/>
  <line x1="35" y1="42" x2="35" y2="58" stroke="#fff" stroke-width="1.5"/>
  
  <!-- Soccer ball -->
  <circle cx="65" cy="45" r="7" fill="url(#accentGradient)" opacity="0.8"/>
  <polygon points="65,40 67,44 63,46 61,44" fill="#fff"/>
  <polygon points="65,50 67,46 69,48 67,50" fill="#fff"/>
  
  <!-- Tennis ball -->
  <circle cx="95" cy="40" r="6" fill="#90EE90" opacity="0.9"/>
  <path d="M 89 40 Q 95 35 101 40" stroke="#fff" stroke-width="1" fill="none"/>
  <path d="M 89 40 Q 95 45 101 40" stroke="#fff" stroke-width="1" fill="none"/>
  
  <!-- Main text -->
  <text x="140" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    SPORT
  </text>
  <text x="140" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="url(#primaryGradient)">
    PRODUCTS
  </text>
  <text x="140" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#7F8C8D">
    STORE
  </text>
  
  <!-- Decorative elements -->
  <circle cx="260" cy="35" r="3" fill="url(#primaryGradient)" opacity="0.7"/>
  <circle cx="270" cy="45" r="2" fill="url(#accentGradient)" opacity="0.6"/>
  <circle cx="265" cy="55" r="2.5" fill="url(#primaryGradient)" opacity="0.5"/>
  
  <!-- Speed lines for dynamic effect -->
  <line x1="250" y1="25" x2="280" y2="20" stroke="url(#accentGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="245" y1="35" x2="275" y2="30" stroke="url(#primaryGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="240" y1="45" x2="270" y2="40" stroke="url(#accentGradient)" stroke-width="1" opacity="0.2"/>
</svg>