<svg class="logo-svg" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="circuit1" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
		</linearGradient>
	</defs>
	<!-- Circuit nodes -->
	<circle cx="20" cy="40" r="4" fill="url(#circuit1)"/>
	<circle cx="45" cy="30" r="3" fill="url(#circuit1)" opacity="0.8"/>
	<circle cx="70" cy="50" r="3" fill="url(#circuit1)" opacity="0.8"/>
	<circle cx="95" cy="35" r="4" fill="url(#circuit1)"/>
	<!-- Circuit connections -->
	<path d="M24 40 L41 30" stroke="url(#circuit1)" stroke-width="2"/>
	<path d="M48 30 L67 50" stroke="url(#circuit1)" stroke-width="2"/>
	<path d="M73 50 L91 35" stroke="url(#circuit1)" stroke-width="2"/>
	<path d="M99 35 L110 35" stroke="url(#circuit1)" stroke-width="3"/>
	<!-- Processing indicators -->
	<rect x="35" y="37" width="6" height="6" fill="url(#circuit1)" opacity="0.6" rx="1"/>
	<rect x="60" y="42" width="6" height="6" fill="url(#circuit1)" opacity="0.6" rx="1"/>
	<rect x="85" y="32" width="6" height="6" fill="url(#circuit1)" opacity="0.6" rx="1"/>
	<!-- Text -->
	<text x="130" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">StreamLine</text>
	<text x="130" y="50" font-family="Arial, sans-serif" font-size="10" fill="#666">Workflow Automation</text>
</svg>
	