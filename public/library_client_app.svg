<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="digitalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background circle for contrast -->
  <circle cx="60" cy="60" r="55" fill="white" opacity="0.1"/>
  
  <!-- Stack of books -->
  <!-- Book 1 (bottom) -->
  <rect x="25" y="70" width="40" height="8" fill="url(#bookGradient)" rx="2"/>
  <rect x="25" y="70" width="40" height="3" fill="url(#bookGradient)" opacity="0.7" rx="1"/>
  
  <!-- Book 2 (middle) -->
  <rect x="20" y="58" width="45" height="8" fill="url(#book2Gradient)" rx="2"/>
  <rect x="20" y="58" width="45" height="3" fill="url(#book2Gradient)" opacity="0.7" rx="1"/>
  
  <!-- Book 3 (top) -->
  <rect x="30" y="46" width="35" height="8" fill="url(#book3Gradient)" rx="2"/>
  <rect x="30" y="46" width="35" height="3" fill="url(#book3Gradient)" opacity="0.7" rx="1"/>
  
  <!-- Open book on top -->
  <path d="M40 25 Q60 35 80 25 L80 45 Q60 55 40 45 Z" fill="url(#digitalGradient)"/>
  <path d="M40 25 Q60 30 80 25 L80 30 Q60 35 40 30 Z" fill="url(#digitalGradient)" opacity="0.6"/>
  
  <!-- Digital elements (floating dots/pixels) -->
  <circle cx="75" cy="35" r="2" fill="url(#digitalGradient)" opacity="0.8"/>
  <circle cx="85" cy="40" r="1.5" fill="url(#digitalGradient)" opacity="0.6"/>
  <circle cx="80" cy="50" r="1" fill="url(#digitalGradient)" opacity="0.4"/>
  <circle cx="25" cy="40" r="1.5" fill="url(#digitalGradient)" opacity="0.6"/>
  <circle cx="15" cy="50" r="1" fill="url(#digitalGradient)" opacity="0.4"/>
  
  <!-- Book spine details -->
  <line x1="27" y1="70" x2="27" y2="78" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="22" y1="58" x2="22" y2="66" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="46" x2="32" y2="54" stroke="white" stroke-width="1" opacity="0.3"/>
</svg>