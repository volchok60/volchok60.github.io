<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Medical Cross -->
  <rect x="25" y="30" width="12" height="60" fill="url(#iconGradient)" rx="4"/>
  <rect x="7" y="48" width="48" height="12" fill="url(#iconGradient)" rx="4"/>
  
  <!-- Data visualization bars -->
  <rect x="70" y="50" width="8" height="30" fill="url(#iconGradient)" opacity="0.8" rx="2"/>
  <rect x="84" y="35" width="8" height="45" fill="url(#iconGradient)" opacity="0.8" rx="2"/>
  <rect x="98" y="42" width="8" height="38" fill="url(#iconGradient)" opacity="0.8" rx="2"/>
</svg>